<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Cadastro de desconto exclusivo para fornecedores do Universo da Debutante." />
    <title>Cadastro de Desconto | Universo da Debutante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=2" />
    <link rel="stylesheet" href="brand-logo.css?v=3" />
    <link rel="stylesheet" href="enhancements.css?v=1" />
    <link rel="stylesheet" href="modern.css?v=1" />
    <link rel="stylesheet" href="mobile-fix.css?v=2" />
    <link rel="stylesheet" href="cadastro-fornecedor.css?v=2" />
  </head>
  <body class="cadastro-page-body">
    <header class="topbar">
      <a class="brand brand-image" href="index.html#inicio" aria-label="Universo da Debutante - início"><img src="assets/brand/logo-header.png" alt="Universo da Debutante" /></a>
    </header>

    <main>
      <section class="cadastro section">
        <div class="section-heading"><p class="eyebrow pink"><span></span> parceria exclusiva</p><h1>Cadastre o desconto do grupo</h1></div>
        <p class="section-intro">Preencha os dados abaixo para liberar sua vantagem exclusiva para as mães do Universo da Debutante.</p>

        <form id="cadastroForm" class="cadastro-form" novalidate>
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required autocomplete="name" placeholder="Seu nome" />
          </div>

          <div class="field">
            <label for="empresa">Nome da empresa</label>
            <input id="empresa" name="empresa" type="text" required autocomplete="organization" placeholder="Nome da sua empresa" />
          </div>

          <div class="field">
            <label for="desconto">Tipo de desconto</label>
            <select id="desconto" name="desconto" required>
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="Tabela especial para o grupo">Tabela especial para o grupo</option>
              <option value="5% de desconto para o grupo">5% de desconto para o grupo</option>
              <option value="10% de desconto para o grupo">10% de desconto para o grupo</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="field" id="descontoOutroField" hidden>
            <label for="descontoOutro">Descreva o desconto</label>
            <input id="descontoOutro" name="descontoOutro" type="text" placeholder="Ex.: brinde exclusivo para o grupo" />
          </div>

          <div class="field">
            <label for="descricao">Descrição da empresa</label>
            <textarea id="descricao" name="descricao" maxlength="140" required placeholder="Conte em poucas palavras o que sua empresa oferece"></textarea>
            <span class="char-counter"><span id="charCount">0</span>/140</span>
          </div>

          <button type="submit" class="button button-dark" id="submitButton">
            <span id="submitLabel">Enviar cadastro</span> <span>→</span>
          </button>

          <p class="form-feedback" id="formFeedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer><a class="brand brand-image-footer" href="index.html#inicio"><img src="assets/brand/logo-dark.png" alt="Universo da Debutante" /></a><p>© 2026 Universo da Debutante. Feito para celebrar histórias únicas.</p></footer>
    <script src="cadastro-fornecedor.js?v=1"></script>
  </body>
</html>
